name: Build Encore

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install Metal toolchain (for the shader check)
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Check Metal shaders
        run: ./Scripts/check-shaders.sh

      - name: Build Encore.app (universal)
        run: UNIVERSAL=1 DMG=1 ./Scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Encore-macOS
          path: |
            dist/Encore.zip
            dist/Encore.dmg
          if-no-files-found: error

      - name: Smoke test (launch, play, screenshot)
        timeout-minutes: 8
        run: |
          set +e
          APP="$PWD/dist/Encore.app"
          SHOTS="$PWD/dist/screens"; mkdir -p "$SHOTS"
          VIDEO="https://www.youtube.com/watch?v=aqz-KE-bpKQ"   # Big Buck Bunny (Blender Foundation, CC BY 3.0)
          shot() {
            name="$1"; shift
            "$APP/Contents/MacOS/Encore" "$@" > "$SHOTS/$name.log" 2>&1 &
            pid=$!
            sleep 28
            if kill -0 $pid 2>/dev/null; then echo "✅ $name: running"; else echo "❌ $name: exited"; cat "$SHOTS/$name.log"; fi
            screencapture -x "$SHOTS/$name.png"
            sips -Z 1400 -s format jpeg -s formatOptions 55 "$SHOTS/$name.png" --out "$SHOTS/$name.jpg" >/dev/null
            echo "::group::$name.jpg (base64)"
            echo "BEGIN-SHOT $name"; base64 -i "$SHOTS/$name.jpg" | tr -d '\n'; echo; echo "END-SHOT $name"
            echo "::endgroup::"
            grep -iE "error|fail|metal" "$SHOTS/$name.log" | head -20
            kill $pid 2>/dev/null; sleep 2; kill -9 $pid 2>/dev/null
          }
          shot audio-voxels --play "$VIDEO" --mode audio --visualizer voxels
          shot audio-halo --play "$VIDEO" --mode audio --visualizer halo
          shot video --play "$VIDEO" --mode video
          shot browse --play "$VIDEO" --mode audio --show home
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i encore && cat ~/Library/Logs/DiagnosticReports/Encore* | head -80
          exit 0

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Encore-screenshots
          path: dist/screens
          if-no-files-found: ignore

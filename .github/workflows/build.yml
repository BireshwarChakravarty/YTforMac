name: Build Encore

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install Metal toolchain (for the shader check)
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Check Metal shaders
        run: ./Scripts/check-shaders.sh

      - name: Build Encore.app (universal)
        run: UNIVERSAL=1 DMG=1 ./Scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Encore-macOS
          path: |
            dist/Encore.zip
            dist/Encore.dmg
          if-no-files-found: error

      - name: Smoke test (launch, play, capture Encore's windows)
        timeout-minutes: 8
        run: |
          set +e
          SHOTS="$PWD/dist/screens"; mkdir -p "$SHOTS"
          VIDEO="https://www.youtube.com/watch?v=aqz-KE-bpKQ"   # Big Buck Bunny (Blender Foundation, CC BY 3.0)
          "$PWD/dist/Encore.app/Contents/MacOS/Encore" --play "$VIDEO" --mode audio --visualizer voxels \
              --snapshot "$SHOTS" --snapshot-wait 25 > "$SHOTS/run.log" 2>&1 &
          PID=$!
          for i in $(seq 1 150); do
            grep -q SNAPSHOTS-DONE "$SHOTS/run.log" && break
            kill -0 $PID 2>/dev/null || { echo "❌ Encore exited early"; break; }
            sleep 2
          done
          grep -E "STATE|SNAPSHOT|rror" "$SHOTS/run.log" | head -60
          kill -0 $PID 2>/dev/null && echo "✅ Encore still running" 
          kill $PID 2>/dev/null; sleep 1; kill -9 $PID 2>/dev/null
          for f in "$SHOTS"/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png)
            sips -Z 1300 -s format jpeg -s formatOptions 50 "$f" --out "$SHOTS/$n.jpg" >/dev/null
            echo "BEGIN-SHOT $n"; base64 -i "$SHOTS/$n.jpg" | tr -d '\n'; echo; echo "END-SHOT $n"
          done
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i encore && head -120 ~/Library/Logs/DiagnosticReports/Encore*
          exit 0

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Encore-screenshots
          path: dist/screens
          if-no-files-found: ignore

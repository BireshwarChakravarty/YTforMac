name: Build Encore

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a GitHub Release with this version (e.g. 1.0.0). Leave empty to just build."
        required: false
        default: ""
      replace_existing:
        description: "If a release with this version already exists, delete it (and its tag) and publish again from this commit."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install Metal toolchain (for the shader check)
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Check Metal shaders
        run: ./Scripts/check-shaders.sh

      - name: Build Encore.app (universal)
        env:
          VERSION: ${{ inputs.release_version }}
        run: UNIVERSAL=1 DMG=1 ./Scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Encore-macOS
          path: |
            dist/Encore.zip
            dist/Encore.dmg
          if-no-files-found: error

      - name: Smoke test (launch, play, capture Encore's windows, check audio capture)
        timeout-minutes: 10
        run: |
          set +e
          SHOTS="$PWD/dist/screens"; mkdir -p "$SHOTS"
          VIDEO="https://www.youtube.com/watch?v=aqz-KE-bpKQ"   # Big Buck Bunny (Blender Foundation, CC BY 3.0)
          # Best effort: pre-approve "System Audio Recording" for Encore so the tap check can run unattended.
          NOW=$(date +%s)
          for DB in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceAudioCapture','app.encore.player',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$NOW);" 2>&1 | head -2
          done
          system_profiler SPAudioDataType 2>/dev/null | head -20
          open --stdout "$SHOTS/run.log" --stderr "$SHOTS/run.log" -a "$PWD/dist/Encore.app" --args \
              --play "$VIDEO" --mode audio --visualizer flow --snapshot "$SHOTS" --snapshot-wait 25 --demo-visuals --test-tone
          for i in $(seq 1 200); do
            grep -q SNAPSHOTS-DONE "$SHOTS/run.log" 2>/dev/null && break
            pgrep -x Encore >/dev/null || { echo "❌ Encore exited early"; break; }
            sleep 2
          done
          grep -E "STATE|SNAPSHOT|WINDOW|WINLIST|PAGE|TAP|rror" "$SHOTS/run.log" | head -100
          pgrep -x Encore >/dev/null && echo "✅ Encore still running"
          pkill -x Encore; sleep 1; pkill -9 -x Encore
          for f in "$SHOTS"/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png)
            sips -Z 1300 -s format jpeg -s formatOptions 50 "$f" --out "$SHOTS/$n.jpg" >/dev/null
            echo "BEGIN-SHOT $n"; base64 -i "$SHOTS/$n.jpg" | tr -d '\n'; echo; echo "END-SHOT $n"
          done
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i encore && head -120 ~/Library/Logs/DiagnosticReports/Encore*
          exit 0

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Encore-screenshots
          path: dist/screens
          if-no-files-found: ignore

      - name: Remove existing release with the same version
        if: ${{ inputs.release_version != '' && inputs.replace_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ inputs.release_version }}" --cleanup-tag --yes --repo "${{ github.repository }}" || true

      - name: Publish GitHub Release
        if: ${{ inputs.release_version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: Encore ${{ inputs.release_version }}
          files: |
            dist/Encore.dmg
            dist/Encore.zip
          body: |
            **Encore** is a native YouTube player for macOS. Media keys always work, even with every window closed.
            It has video and audio modes at the highest available quality, ten visualisers that move with the music, a menu bar player and a floating mini player. Seven of the visualisers run on a film-style Metal pipeline with light trails, bloom and beat detection: Flow, Swarm, Ambient, Halo, Aurora, Orb and Tide.

            ### Install
            1. Download **Encore.dmg** below, open it and drag Encore to Applications.
            2. The app is ad-hoc signed, not notarized. On first launch, right-click it and choose **Open**, or run:
               ```
               xattr -cr /Applications/Encore.app
               ```
            3. Sign in with the account button at the bottom of the sidebar to get your feed and subscriptions.

            **Visualisers:** the first time one is on screen, macOS asks to let Encore use **System Audio Recording**. Encore only listens to its own playback so the visuals can follow the music, and nothing is recorded or saved. The badge next to the visualiser picker shows **Live audio** when it is following the real sound. If it says **Allow audio access**, click it to open the right System Settings page.

            Playback always requests the highest quality YouTube offers. Use the **Quality** menu in the toolbar to change it.

            Universal build (Apple silicon and Intel). Requires macOS 14 or later; Liquid Glass styling appears on macOS 26 and later.

            Encore is an independent app and is not affiliated with YouTube or Google.
